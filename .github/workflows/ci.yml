name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # No hardware needed: the protocol tests capture the buffers that would
      # reach the ioctl and assert on the bytes.
      - name: Run tests
        working-directory: cli
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the plugin manifest is valid JSON and well-formed
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("manifest.json"))
          required = ["schemaVersion", "id", "name", "version", "kinds", "entryPoints"]
          missing = [k for k in required if k not in m]
          assert not missing, f"manifest missing: {missing}"
          assert m["id"].count(".") == 1, "plugin id must be <author>.<name>"
          entry = m["entryPoints"]["barWidget"]
          import os
          assert os.path.isfile(entry), f"entry point {entry} not found"
          print(f"manifest OK: {m['id']} -> {entry}")
          PY

      - name: Reject symlinks (Omarchy refuses them inside a plugin folder)
        run: |
          found=$(find . -type l -not -path './.git/*' || true)
          if [ -n "$found" ]; then echo "symlinks found:"; echo "$found"; exit 1; fi
          echo "no symlinks"

      - name: Byte-compile the CLI
        run: python3 -m compileall -q cli/src/alienfx_ctl

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n share/bin/omarchy-alienfx-wizard
          bash -n share/omarchy/hooks/theme-set.d/50-omarchy-alienfx
