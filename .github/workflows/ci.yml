name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # No hardware needed: the protocol tests capture the buffers that would
      # reach the ioctl and assert on the bytes.
      - name: Run tests
        working-directory: cli
        run: python -m pytest tests -q

      - name: Check the README's test count is current
        run: |
          python3 - <<'PY'
          import re, subprocess

          # This lives in the test job because it is the only one with pytest
          # installed; in the lint job the collect step produced no output at
          # all and the check failed on an empty match.
          out = subprocess.run(["python", "-m", "pytest", "tests", "-q", "--collect-only"],
                               cwd="cli", capture_output=True, text=True).stdout
          found = re.search(r"(\d+) tests? collected", out)
          assert found, f"could not read a test count from pytest:\n{out[-500:]}"
          actual = int(found.group(1))

          claimed = {int(n) for n in re.findall(r"(\d+) tests?, no hardware",
                                                open("README.md").read())}
          # A stale count is small, but it quietly tells a reader the docs are
          # not maintained.
          assert claimed == {actual}, f"README claims {claimed}, actual {actual}"
          print(f"README test count OK: {actual}")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the plugin manifest against what Omarchy requires
        run: |
          python3 - <<'PY'
          import json, os

          m = json.load(open("manifest.json"))

          # PluginRegistry.validateManifest rejects a manifest outright if any
          # of these are missing or schemaVersion is not 1, and the only symptom
          # is a plugin that silently never loads.
          assert m.get("schemaVersion") == 1, "schemaVersion must be exactly 1"
          for key in ("id", "name", "version", "kinds", "entryPoints"):
              assert key in m, f"manifest missing required field: {key}"
          assert isinstance(m["kinds"], list) and m["kinds"], "kinds must be a non-empty list"
          assert isinstance(m["entryPoints"], dict), "entryPoints must be an object"

          plugin_id = str(m["id"])
          assert plugin_id, "id must not be empty"
          assert "/" not in plugin_id and ".." not in plugin_id, "id must not contain / or .."
          assert not plugin_id.startswith("/"), "id must not be absolute"
          assert plugin_id.count(".") == 1, "id must be <author>.<name>"

          for kind, entry in m["entryPoints"].items():
              assert not os.path.isabs(entry), f"{kind} entry point must be relative"
              assert ".." not in entry, f"{kind} entry point must not contain .."
              assert os.path.isfile(entry), f"{kind} entry point {entry} not found"

          for key in ("author", "license", "description", "version"):
              assert m.get(key), f"manifest should declare {key} for submission"

          widget = m.get("barWidget") or {}
          if "defaultSection" in widget:
              assert widget["defaultSection"] in ("left", "center", "right"), \
                  "defaultSection must be left, center or right"

          print(f"manifest OK: {plugin_id} v{m['version']} -> {m['entryPoints']}")
          PY

      - name: Check declared settings match the settings the QML reads
        run: |
          python3 - <<'PY'
          import json, re

          m = json.load(open("manifest.json"))
          widget = m.get("barWidget") or {}
          declared = {f["key"] for f in widget.get("schema", [])}
          defaults = set(widget.get("defaults") or {})
          read = set(re.findall(r'setting\(\s*"([^"]+)"', open("Panel.qml").read()))

          # A setting the QML reads but the manifest never declares cannot be
          # configured; one declared but never read is a lie in the settings
          # form. Both fail silently.
          assert not (read - declared), f"read but not declared: {sorted(read - declared)}"
          assert not (declared - read), f"declared but never read: {sorted(declared - read)}"
          assert declared == defaults, f"schema and defaults disagree: {sorted(declared ^ defaults)}"
          print(f"settings OK: {sorted(declared)}")
          PY

      - name: Check the bundled keyboard layouts
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "cli/src")

          raw = json.load(open("cli/src/alienfx_ctl/data/layouts.json"))
          layouts = raw["layouts"]
          assert layouts, "no bundled layouts"

          for name, spec in layouts.items():
              assert spec.get("label"), f"{name}: no label to show the user"
              assert "verified" in spec, f"{name}: must say whether it was tested"
              assert spec.get("source"), f"{name}: must say where it came from"
              seen = set()
              for row in spec["rows"]:
                  assert row, f"{name}: empty row"
                  for entry in row:
                      # Shapes only. An LED index is never bundled: they are
                      # irregular on real hardware and cannot be inferred, and a
                      # wrong one silently lights the wrong key.
                      assert len(entry) == 2, f"{name}: unexpected field in {entry}"
                      key, col = entry
                      assert isinstance(key, str) and key, f"{name}: bad key {key!r}"
                      assert isinstance(col, int) and col >= 0, f"{name}: bad column {col!r}"
                      assert key not in seen, f"{name}: {key} appears twice"
                      seen.add(key)

          from alienfx_ctl import layout
          for name in layouts:
              for key in layout.load_bundled(name).keys():
                  assert key in layout.LABELS or (key.isalnum() and len(key) <= 3), \
                      f"{name}: {key!r} would be shown to the user as-is"

          print(f"layouts OK: {', '.join(sorted(layouts))}")
          PY

      - name: Check the shipped keymap is valid
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "cli/src")
          from alienfx_ctl import keymap
          data = keymap.validate(json.load(open(keymap.SHIPPED_KEYMAP)))
          print(f"shipped keymap OK: {keymap.describe(data)}")
          PY

      - name: Reject symlinks (Omarchy refuses them inside a plugin folder)
        run: |
          found=$(find . -type l -not -path './.git/*' || true)
          if [ -n "$found" ]; then echo "symlinks found:"; echo "$found"; exit 1; fi
          echo "no symlinks"

      - name: Byte-compile the CLI
        run: python3 -m compileall -q cli/src/alienfx_ctl

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n share/bin/omarchy-alienfx-wizard
          bash -n share/omarchy/hooks/theme-set.d/50-omarchy-alienfx

      - name: Check the CLI and the manifest agree on the version
        run: |
          python3 - <<'PY'
          import json, re
          manifest = json.load(open("manifest.json"))["version"]
          source = open("cli/src/alienfx_ctl/__init__.py").read()
          cli = re.search(r'__version__\s*=\s*"([^"]+)"', source).group(1)
          # They are reported in different places - the plugin listing and
          # `alienfx-ctl --version` - so a mismatch makes bug reports ambiguous.
          assert manifest == cli, f"manifest {manifest} != CLI {cli}"
          print(f"version OK: {cli}")
          PY
